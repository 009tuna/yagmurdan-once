name: Vercel Deploy Hook (Collaborators)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel-deploy:
    name: Trigger Vercel Production Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor != '009tuna' ||
      (github.event.head_commit.author.username != '009tuna' &&
       github.event.head_commit.author.email != 'tunahan.81.jb@gmail.com')
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/vercel_hook.json -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          cat /tmp/vercel_hook.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Vercel Deploy Hook returned HTTP $HTTP_CODE"
            exit 1
          fi
